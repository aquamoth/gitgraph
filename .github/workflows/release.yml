name: Release

# Pushing a tag vX.Y.Z publishes a GitHub Release with binaries for Linux, Windows and macOS.
# Bump `version` in the root Cargo.toml (through a PR) before tagging: GITGRAPH_RELEASE_TAG makes
# crates/gitgraph/build.rs fail the build unless the tag matches it and points at the commit
# being built. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Cross-compiled on the Apple silicon runner, so its tests and version check can't run.
          - { os: macos-latest, target: x86_64-apple-darwin, cross: true }
    runs-on: ${{ matrix.os }}
    env:
      GITGRAPH_RELEASE_TAG: ${{ github.ref_name }}
    # No rust-cache: caches saved by a tag run are never restored by later runs, and a release
    # should come from a clean build anyway.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check version
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          expected="gitgraph ${GITHUB_REF_NAME#v} ($(git rev-parse --short=7 HEAD))"
          actual=$(target/${{ matrix.target }}/release/gitgraph --version)
          echo "$actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::--version printed '$actual', expected '$expected'"
            exit 1
          fi
      - name: Package
        shell: bash
        run: |
          name="gitgraph-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir -p "$name" dist
          cp README.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/gitgraph.exe" "$name/"
            7z a "dist/$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/gitgraph" "$name/"
            tar czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a pre-release part (v0.3.0-rc.1) makes a pre-release.
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "gitgraph ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            $prerelease
