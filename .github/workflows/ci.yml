name: CI

# PRs are tested on their merge result, and main's ruleset requires them to be up to date with main
# before merging. Pushes to main still run: that seeds the Rust cache PR runs restore from (a PR run
# can read caches saved on main, never another PR's), so new PRs don't start from a cold build.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the older run of that PR that is still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: gitgraph-${{ matrix.os }}
          path: |
            target/release/gitgraph
            target/release/gitgraph.exe
          if-no-files-found: ignore
