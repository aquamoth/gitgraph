name: CI

# PRs are tested on their merge result, and main's ruleset requires them to be up to date with main
# before merging. Pushes to main still run: that seeds the Rust cache PR runs restore from (a PR run
# can read caches saved on main, never another PR's), so new PRs don't start from a cold build.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the older run of that PR that is still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # Linux runs in Ubuntu 22.04, like the release build (see release.yml).
          - { os: ubuntu-latest, container: "ubuntu:22.04" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Prepare container
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git
      - uses: actions/checkout@v6
      - name: Trust the checkout
        if: matrix.container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # The binary with its license, NOTICE and the licenses of the crates built into it.
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/parterre${{ runner.os == 'Windows' && '.exe' || '' }} LICENSE NOTICE dist/
          cargo about generate --locked -c packaging/about.toml packaging/about.hbs \
            -o dist/THIRD-PARTY-NOTICES.html
      - uses: actions/upload-artifact@v7
        with:
          name: parterre-${{ matrix.os }}
          path: dist/
